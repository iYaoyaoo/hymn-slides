name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 离屏运行 GUI 测试（CI 无显示器）
  QT_QPA_PLATFORM: offscreen
  # 全程 UTF-8：Windows 控制台默认 cp1252，中文输出会 UnicodeEncodeError
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  # ① Windows x64：pytest → LO 下载提取 → lite+full 构建 → zip → SHA256
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: pytest
        run: python -m pytest tests/ -q

      - name: 下载并提取 LibreOffice（Windows msi）
        run: python tools/bundle_lo.py --platform windows-x64 --download

      - name: 构建 lite（runner 无系统 LO，selftest 由 full 变体校验，记录跳过）
        run: python tools/build.py --variant lite --arch x86_64 --skip-selftest

      - name: 构建 full
        run: python tools/build.py --variant full --arch x86_64

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-lite
          path: dist/windows-lite.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-full
          path: dist/windows-full.zip

      - name: SHA256
        shell: pwsh
        run: |
          Get-FileHash dist/windows-lite.zip -Algorithm SHA256 | Format-List
          Get-FileHash dist/windows-full.zip -Algorithm SHA256 | Format-List
          "windows-lite.zip  $((Get-FileHash dist/windows-lite.zip -Algorithm SHA256).Hash.ToLower())" | Out-File -Append SHA256SUMS.txt -Encoding utf8
          "windows-full.zip  $((Get-FileHash dist/windows-full.zip -Algorithm SHA256).Hash.ToLower())" | Out-File -Append SHA256SUMS.txt -Encoding utf8

      - name: 上传校验和
        uses: actions/upload-artifact@v4
        with:
          name: windows-sha256
          path: SHA256SUMS.txt

  # ② macOS arm64 原生：pytest(offscreen) → LO dmg → full --arch arm64 → zip → SHA256
  mac-arm64:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python3 -m pip install -r requirements.txt

      - name: pytest（offscreen）
        run: python3 -m pytest tests/ -q

      - name: 下载并提取 LibreOffice（mac aarch64 dmg）
        run: python3 tools/bundle_lo.py --platform mac-arm64 --download

      - name: 构建 full（arm64，含 lipo 架构断言）
        run: python3 tools/build.py --variant full --arch arm64

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-full
          path: dist/mac-arm64-full.zip

      - name: SHA256
        run: |
          shasum -a 256 dist/mac-arm64-full.zip | tee -a SHA256SUMS.txt

      - name: 上传校验和
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64-sha256
          path: SHA256SUMS.txt

  # ③ macOS Intel（Rosetta 路径）：python.org universal2 → arch -x86_64 全链
  mac-intel-rosetta:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rosetta（幂等）
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: 安装 python.org universal2（3.12.10，python.org 最新 3.12.x macOS pkg）
        run: |
          curl -fsSL -o /tmp/python.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg /tmp/python.pkg -target /

      - name: 安装依赖（x86_64 轮子）
        run: |
          PY="arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12"
          $PY -m pip install --upgrade pip
          $PY -m pip install -r requirements.txt

      - name: pytest（offscreen；异常时降级 --selftest 并记录，架构断言不豁免）
        run: |
          PY="arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12"
          # 先提取 LO 到仓库 libreoffice/（符号链接），保证降级 --selftest 可命中捆绑候选
          $PY tools/bundle_lo.py --platform mac-intel --download
          ln -sfn "$PWD/dist_staging/libreoffice" "$PWD/libreoffice"
          export QT_QPA_PLATFORM=offscreen
          if $PY -m pytest tests/ -q; then
            echo "pytest 通过"
          else
            echo "::warning::Rosetta offscreen pytest 异常，按规范降级为 --selftest（记录于产物与 PROGRESS）"
            $PY main.py --selftest
          fi

      - name: 构建 full（x86_64，含 lipo 架构断言，不可豁免）
        run: |
          PY="arch -x86_64 /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12"
          $PY tools/build.py --variant full --arch x86_64

      - name: 清理符号链接（防打包污染）
        run: rm -f libreoffice

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mac-intel-full
          path: dist/mac-intel-full.zip

      - name: SHA256
        run: |
          shasum -a 256 dist/mac-intel-full.zip | tee -a SHA256SUMS.txt

      - name: 上传校验和
        uses: actions/upload-artifact@v4
        with:
          name: mac-intel-sha256
          path: SHA256SUMS.txt

  # 发布（仅 tag 触发）：收集 4 产物 → GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac-arm64, mac-intel-rosetta]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 汇总产物与校验和
        run: |
          mkdir -p release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          cat artifacts/*-sha256/SHA256SUMS.txt | tee SHA256SUMS.txt
          ls -l release/

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "HymnSlides ${GITHUB_REF_NAME}" \
            --notes-file docs/RELEASE_NOTES.md \
            release/windows-lite.zip release/windows-full.zip \
            release/mac-arm64-full.zip release/mac-intel-full.zip
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --clobber
